<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業ツール</title>
<style>
:root{--red:#dc4852;--yellow:#f4c13a;--teal:#36afbc;--green:#51ac41;--blue:#409edc;--ink:#1f2d3d;--sub:#6b7785;--line:#dde3ea;--bg:#ebf0f6}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink)}
header{background:white;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(90deg,var(--red) 0 20%,var(--yellow) 20% 40%,var(--teal) 40% 60%,var(--green) 60% 80%,var(--blue) 80% 100%)}
.head-inner{max-width:1100px;margin:0 auto;padding:20px 25px 25px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:20px}
.logo{height:48px;width:auto;display:block}
.divider{width:1px;height:46px;background:var(--line)}
header h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.02em}
header p{margin:3px 0 0;font-size:14px;color:var(--sub)}
.settings-btn{border:1px solid var(--line);border-radius:50%;width:46px;height:46px;padding:0;background:white;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;flex-shrink:0}
.settings-btn:hover{background:#f4f7fa}
.settings-btn:focus-visible,.button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.container{max-width:1100px;margin:32px auto;padding:0 25px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.button{--accent:var(--blue);display:flex;align-items:center;gap:18px;min-height:110px;padding:0 26px;background:white;border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;text-decoration:none;color:var(--ink);font-size:20px;font-weight:600;position:relative;box-sizing:border-box}
.button:hover{background:#f9fbfd;border-color:#c9d2dc;border-left-color:var(--accent)}
.button.unset{color:#999}
.button.unset::after{content:"未登録";position:absolute;right:16px;bottom:10px;font-size:12px;font-weight:normal;color:#b45309}
.icon{font-size:38px;line-height:1}
.label{display:flex;flex-direction:column;text-align:left}
.desc{font-size:13px;font-weight:normal;color:var(--sub);margin-top:5px}
footer{text-align:center;color:var(--sub);margin-top:40px;font-size:13px}
.overlay{display:none;position:fixed;inset:0;background:rgba(31,45,61,.45);align-items:center;justify-content:center;padding:20px}
.panel{background:white;width:min(700px,100%);max-height:90vh;overflow-y:auto;border-radius:14px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.2);box-sizing:border-box}
.panel h2{margin-top:0;font-size:20px}
.note{background:#f4f7fa;padding:12px;border-radius:8px;font-size:14px;line-height:1.7;color:#444}
.item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.item h3{margin:0 0 6px;font-size:16px}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px;margin:8px 0;align-items:center;font-size:14px}
input{padding:10px;border:1px solid #c5ced8;border-radius:7px;font-size:15px;width:100%;box-sizing:border-box}
input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.actions{text-align:right;margin-top:22px;position:sticky;bottom:-28px;background:white;padding:12px 0}
.actions button{padding:10px 18px;border:0;border-radius:7px;font-weight:bold;cursor:pointer;font-size:15px}
.save{background:var(--ink);color:white}.cancel{background:#e4e9ef;color:var(--ink);margin-right:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 22px;border-radius:8px;font-size:15px;display:none;max-width:90%}
header h1{white-space:nowrap}
@media(max-width:700px){.logo{height:28px}.divider{height:30px}.brand{gap:12px}header h1{font-size:18px}header p{display:none}.head-inner{padding:14px 16px 19px}.menu{grid-template-columns:1fr}.row{grid-template-columns:1fr}.container{padding:0 15px}}
</style>
</head>

      <div class="divider"></div>
      <div>
        <h1>作業ツール</h1>
        <p>使用するツールを選択してください</p>
      </div>
    </div>
    <button class="settings-btn" id="openSettings" title="設定" aria-label="設定">⚙</button>
  </div>
</header>

<div class="container">
  <div class="menu" id="menu"></div>
  <footer>TOYLO PARK 作業ツール</footer>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="panel">
    <h2>⚙ ランチャー設定</h2>
    <div class="note">
      開きたいWebページのURL（https:// から始まる文字）を「開くURL」欄に貼り付けて、「設定を保存」を押してください。<br>
      URLは、そのページをChromeで開いたときの上のアドレス欄からコピーできます。
    </div>
    <div id="settingsRows"></div>
    <div class="actions">
      <button class="cancel" id="cancelSettings">キャンセル</button>
      <button class="save" id="saveSettings">設定を保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 設定を保存する場所の名前
const STORAGE_KEY = 'gyomuLauncherSettings_v2';

// 最初の状態（初期設定）
const DEFAULT_ITEMS = [
  {icon:'🎫', name:'ライブポケットQR確認', desc:'ライブポケット用QRコード読み取り確認',
   path:'https://pirocchi2001.github.io/livepocket-qr-checker/'},
  {icon:'🎍', name:'年賀状価格計算', desc:'マイプリント年賀状価格計算',
   path:'https://nengajo-simulation.nengajo-sim.workers.dev/'},
  {icon:'📌', name:'コルクボード', desc:'メモなどをPCに転送するクリップボード',
   path:'https://corkboard-share.vercel.app/'},
  {icon:'📷', name:'売場スキャン', desc:'バーコード・JAN数字を読み取ってPCに送る',
   path:'https://handyscan-to-pc-hiroshi.web.app/admin.html'}
]

// 保存された設定を読み込む（なければ初期設定）
function loadItems(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved) && saved.length) return saved;
  }catch(e){}
  return DEFAULT_ITEMS.map(x=>({...x}));
}

function saveItems(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    return true;
  }catch(e){
    return false;
  }
}

let items = loadItems();
const ACCENTS = ['#dc4852','#f4c13a','#36afbc','#51ac41','#409edc'];

const menu = document.getElementById('menu');
const overlay = document.getElementById('settingsOverlay');
const rows = document.getElementById('settingsRows');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.style.display='none', 4000);
}

// 前後の空白や " " を取り除く
function cleanPath(p){
  return p.trim().replace(/^"+|"+$/g,'').trim();
}

// ランチャーのボタンを作る
function renderMenu(){
  menu.innerHTML = '';
  items.forEach(item=>{
    const a = document.createElement('a');
    a.className = 'button' + (item.path ? '' : ' unset');
    a.style.setProperty('--accent', ACCENTS[menu.children.length % ACCENTS.length]);
    a.href = '#';
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = item.icon;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.name;
    if(item.desc){
      const d = document.createElement('span');
      d.className = 'desc';
      d.textContent = item.desc;
      label.append(d);
    }
    a.append(icon, label);
    a.addEventListener('click', e=>{
      e.preventDefault();
      if(!item.path){
        showToast('「' + item.name + '」にはまだ開く先が登録されていません。右上の ⚙ から登録してください。');
        return;
      }
      if(/^https?:\/\//i.test(item.path)){
        window.open(item.path, '_blank', 'noopener');
        return;
      }
      showToast('「' + item.name + '」のURLが正しくありません。https:// から始まるURLを登録してください。');
    });
    menu.append(a);
  });
}

// 設定画面を開く
document.getElementById('openSettings').addEventListener('click', ()=>{
  rows.innerHTML = '';
  const marks = '①②③④⑤⑥⑦⑧⑨⑩';
  items.forEach((item,i)=>{
    const box = document.createElement('div');
    box.className = 'item';

    const h = document.createElement('h3');
    h.textContent = (marks[i] || (i+1)+'.') + ' ' + item.icon + ' ' + item.name;

    const r1 = document.createElement('div'); r1.className = 'row';
    const l1 = document.createElement('label'); l1.textContent = '表示名';
    const nameInput = document.createElement('input');
    nameInput.value = item.name;
    nameInput.dataset.index = i; nameInput.dataset.field = 'name';
    r1.append(l1, nameInput);

    const r2 = document.createElement('div'); r2.className = 'row';
    const l2 = document.createElement('label'); l2.textContent = '開くURL';
    const pathInput = document.createElement('input');
    pathInput.value = item.path;
    pathInput.placeholder = '例：https://example.com/';
    pathInput.dataset.index = i; pathInput.dataset.field = 'path';
    r2.append(l2, pathInput);

    box.append(h, r1, r2);
    rows.append(box);
  });
  overlay.style.display = 'flex';
});

document.getElementById('cancelSettings').addEventListener('click', ()=>{
  overlay.style.display = 'none';
});

// 設定を保存
document.getElementById('saveSettings').addEventListener('click', ()=>{
  rows.querySelectorAll('input').forEach(input=>{
    const i = Number(input.dataset.index);
    if(input.dataset.field === 'name'){
      items[i].name = input.value.trim() || ('ボタン ' + (i+1));
    }else{
      items[i].path = cleanPath(input.value);
    }
  });
  renderMenu();
  overlay.style.display = 'none';
  showToast(saveItems() ? '設定を保存しました' : '設定を保存できませんでした（画面を閉じると元に戻ります）');
});

renderMenu();
</script>
</body>
</html>
